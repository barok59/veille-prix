name: dealabs
on:
  schedule:
    - cron: "3-59/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dealabs
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests feedparser pyyaml
      - run: python veille/main.py dealabs
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      -  name: Sauvegarder l'historique
        run: bash .github/scripts/sauvegarder.sh  data/history_dealabs.json
