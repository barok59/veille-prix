name: test-navigateur
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4 playwright
      - run: playwright install --with-deps chromium
      - name: Lancer le test
        run: python veille/test_navigateur.py
