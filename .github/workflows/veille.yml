name: veille
on:
  schedule:
    - cron: "0 7,12,18 * * *"   # UTC : 8h, 13h, 19h heure de Paris (hiver)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python veille/main.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - name: Sauvegarder l'historique
        run: |
          git config user.name "veille-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/history.json
          git diff --cached --quiet || git commit -m "maj historique" && git push
