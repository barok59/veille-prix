name: prix
on:
  schedule:
    - cron: "0 7,12,18 * * *"   # UTC : 8h, 13h, 19h à Paris (heure d'hiver)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prix
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - run: python veille/main.py prix
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          HEADLESS: "1"
      - name: Sauvegarder l'historique
        run: bash .github/scripts/sauvegarder.sh  data/history_prix.json
        
